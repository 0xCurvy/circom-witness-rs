name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref. Superseded PR pushes are cancelled; master is left
# alone so every commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The circom release the builder compiles with, as a reference to check against.
  CIRCOM_VERSION: v2.2.3
  # The digest GitHub lists for that release's circom-linux-amd64.
  CIRCOM_SHA256: 85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3

jobs:
  library:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          # The action otherwise exports RUSTFLAGS=-D warnings, which applies to
          # every dependency too -- a new release of any crate in the tree that
          # emits a deprecation would then fail CI for reasons we cannot fix.
          # Denying via clippy's own argument scopes it to this crate.
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ir-builder:
    # The GPL builder in ir-builder/ is a separate package with its own lockfile.
    # `cargo test` compares its graphs with the witnesses circom computed for the
    # fixtures, and the script recomputes those witnesses with circom here.
    name: ir-builder (circom IR, no C++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ir-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          # See the note in `library`: scope lint denial to this crate.
          rustflags: ""
          # The package has its own workspace and target directory.
          cache-workspaces: ir-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install circom and circomlib
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/circom" \
            "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          echo "$CIRCOM_SHA256  $HOME/.local/bin/circom" | sha256sum -c -
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --silent --prefix "$RUNNER_TEMP/circomlib" circomlib@2.0.5

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          CIRCOMLIB_INCLUDE: ${{ runner.temp }}/circomlib/node_modules

      - name: Check every fixture against circom
        run: scripts/check-against-circom.sh --all --circomlib "$RUNNER_TEMP/circomlib/node_modules"

      - name: The repository's build-graph.sh runs the builder
        run: ../build-graph.sh --version
